? human-centric-assembly-planning-framework-for-human-robot-collaborative-systems-with-efficient-reinforcement-self-learning-multi-objective-evolutionary-optimizer
: ieee: 'R. Zhao, S. Tao, and P. Li, “Human-centric assembly planning framework for
    human–robot collaborative systems with efficient reinforcement self-learning multi-objective
    evolutionary optimizer,” Advanced Engineering Informatics, vol. 67, Art. no. 103508,
    2025, doi: 10.1016/j.aei.2025.103508.'
  nature: Zhao, R., Tao, S. & Li, P. Human-centric assembly planning framework for
    human–robot collaborative systems with efficient reinforcement self-learning multi-objective
    evolutionary optimizer. Adv. Eng. Inform. 67, 103508 (2025).
  bibtex: |-
    @article{zhao2025human2,
      title = {Human-centric assembly planning framework for human–robot collaborative systems with efficient reinforcement self-learning multi-objective evolutionary optimizer},
      author = {Zhao, Ruihan and Tao, Sichen and Li, Pengzhong},
      year = {2025},
      journal = {Advanced Engineering Informatics},
      volume = {67},
      pages = {103508},
      publisher = {Elsevier BV},
      doi = {10.1016/j.aei.2025.103508},
      url = {https://www.sciencedirect.com/science/article/pii/S147403462500401X},
      status = {published},
      selected = {true},
      public = {true},
      authorrole = {coauthor},
      abbr = {AEI},
      corresponding = {Li, Pengzhong},
      abstract = {Human–robot collaboration (HRC) assembly systems represent an emerging production paradigm that plays a key role in the transition towards human-centric, sustainable, and resilient manufacturing. However, to improve efficiency, HRC often adopts overly compact workflows, high-intensity work rhythms, and rigid task planning modes. Although these designs can improve efficiency in the short term, they overlook the differences in human and robot capabilities, human execution fluctuation, and dynamic fatigue effects. This may lead to excessive physiological load, increased psychological burden on humans, and more safety risks. Such collaboration paradigms not only conflict with the human-centric principle, but also impact the collaboration sustainability. In this study, we innovatively model a series of complex nonlinear relationships necessary to resolve these conflicts, and based on this, we construct a mixed integer programming framework for human-centric HRC assembly task planning (HAPF). HAPF quantitatively and adaptively expresses multiple conflicting objectives as well as coupled constraints such as resources, time, capabilities, and priorities. It is the first to explicitly address the trade-offs between multiple production objectives in HRC, jointly handle discrete decisions and continuous variables, and integrate resource allocation and task planning challenges into a unified optimization model that adapts to dynamic human variability. Furthermore, the inclusion of complex nonlinearities causes the complexity of the multi-objective and multi-constrained human-centric HRC assembly task planning problem (HAPP) based on HAPF to grow exponentially, making it difficult to solve. Therefore, we also propose a reinforcement self-learning-guided genetic operator and differential evolution operator collaborative optimizer (SL-MGDO) specifically designed to handle and solve HAPP. Experiments are conducted on 16 different instances, combining 4 task scales and 4 durations. Statistical tests indicate that the combination of HAPF-based HAPP with SL-MGDO can provide HRC planning solutions that are either comparable to or superior in efficiency to the previous collaboration mode, with higher execution competency, achieving a flexible, non-rigid advanced HRC process. Moreover, compared to 3 ablation variants and 6 widely studied state-of-the-art metaheuristic algorithms, SL-MGDO is able to obtain significantly better solutions. Furthermore, by applying HAPF and SL-MGDO to an actual HRC computer case assembly task, we further confirm the feasibility and practicality of SL-MGDO in real-world engineering applications.},
      preview = {human-centric-assembly-fig1.jpg}
    }
