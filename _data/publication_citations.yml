bio-inspired-computational-model-for-direction-and-speed-detection:
  ieee: 'Y. Hua, Y. Todo, S. Tao, Z. Tang, T. Cheng, and Z. Qiu, “Bio-inspired computational
    model for direction and speed detection,” Knowledge-Based Systems, vol. 300, Art.
    no. 112195, 2024, doi: 10.1016/j.knosys.2024.112195.'
  nature: Hua, Y. et al. Bio-inspired computational model for direction and speed
    detection. Knowl.-Based Syst. 300, 112195 (2024).
  bibtex: |-
    @article{hua2024inspired,
      title = {Bio-inspired computational model for direction and speed detection},
      author = {Hua, Yuxiao and Todo, Yuki and Tao, Sichen and Tang, Zheng and Cheng, Tianqi and Qiu, Zhiyu},
      year = {2024},
      journal = {Knowledge-Based Systems},
      volume = {300},
      pages = {112195},
      publisher = {Elsevier BV},
      doi = {10.1016/j.knosys.2024.112195},
      url = {https://www.sciencedirect.com/science/article/pii/S0950705124008293},
      status = {published},
      selected = {true},
      public = {true},
      authorrole = {coauthor},
      abbr = {KBS},
      corresponding = {Todo, Yuki},
      abstract = {This article introduces a biologically-inspired model capable of detecting both an object’s motion direction and speed, based on retinal neural mechanisms verified through biological experiments. It aims to address the interpretability issues present in current deep learning models. The proposed Motion Detection Neuron (MDN) model, inspired by early research on the retina’s direction and speed sensitivity, replicates the motion detection functions of the retina and primary visual cortex. The design of the MDN, inspired by the layered structure of the retina and incorporating various cell types and functions, has been validated through biological experimentation, providing it with robust biological interpretability. Extensive experiments have been conducted to assess the MDN’s detection accuracy and robustness against various types of noise. Additionally, to verify that the MDN not only offers enhanced biological interpretability but also maintains detection accuracy comparable to leading deep learning algorithms, we compared its performance with that of LeNet ,EfficientNet and RegNet under identical conditions. The results show that the MDN not only provides better biological interpretability and lower hardware demands but also excels in accuracy under specific conditions, comparable to advanced deep learning algorithms.},
      preview = {bio-inspired-direction-speed-fig1.jpg}
    }
