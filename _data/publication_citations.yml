adversarial-game-optimization-a-game-theoretic-metaheuristic-for-efficient-complex-optimization-and-engineering-applications:
  ieee: 'C. Li, Q. Zhang, J. Li, S. Tao, and D. Oliva, “Adversarial game optimization:
    A game-theoretic metaheuristic for efficient complex optimization and engineering
    applications,” Information Sciences, vol. 735, Art. no. 123022, 2026, doi: 10.1016/j.ins.2025.123022.'
  nature: 'Li, C., Zhang, Q., Li, J., Tao, S. & Oliva, D. Adversarial game optimization:
    A game-theoretic metaheuristic for efficient complex optimization and engineering
    applications. Inf. Sci. 735, 123022 (2026).'
  bibtex: |-
    @article{li2026adversarial,
      title = {Adversarial game optimization: A game-theoretic metaheuristic for efficient complex optimization and engineering applications},
      author = {Li, Conglin and Zhang, Qingke and Li, Junqing and Tao, Sichen and Oliva, Diego},
      year = {2026},
      journal = {Information Sciences},
      volume = {735},
      pages = {123022},
      publisher = {Elsevier BV},
      doi = {10.1016/j.ins.2025.123022},
      url = {https://www.sciencedirect.com/science/article/pii/S0020025525011594},
      status = {published},
      selected = {true},
      public = {true},
      authorrole = {coauthor},
      abbr = {INS},
      corresponding = {Zhang, Qingke},
      abstract = {Metaheuristic optimization algorithms have demonstrated strong performance when applied to complex nonlinear optimization tasks. However, their performance often degrades in high-dimensional and multimodal settings due to premature convergence and insufficient global search. To address these limitations, an Adversarial Game Optimization Algorithm (AGOA) is proposed, which constructs a metaheuristic optimization framework based on adversarial game mechanisms. AGOA integrates three mechanisms: (i) a dynamic role-based population partitioning strategy that assigns individuals as elites, explorers, or responders to balance exploration and exploitation; (ii) an adversarial feedback mechanism where worst-case responders introduce directed perturbations to counter elite dominance; and (iii) a diversity-preserving breakout strategy that monitors population stagnation and activates adaptive restarts. AGOA was tested on CEC 2017 (30D/50D/100D) and CEC 2022 (10D/20D), as well as applications including multi-threshold image segmentation, constrained engineering design, and UAV 3D path planning. Experimental evaluations indicate that AGOA achieves superior performance compared with 79 optimizers in solution quality, convergence behavior, and stability, achieving top rankings across all test categories. Theoretical analysis further establishes convergence to the global optimum in expectation and probability under mild conditions. Overall, AGOA offers a scalable and generalizable optimization framework with strong practical relevance. An open-access implementation of AGOA is provided at https://github.com/tsingke/AGOA.},
      preview = {adversarial-game-optimization-fig1.jpg},
      code = {https://github.com/tsingke/AGOA},
    }
? safety-efficiency-integrated-assembly-the-next-stage-adaptive-task-allocation-and-planning-framework-for-human-robot-collaboration
: ieee: 'R. Zhao, S. Tao, and P. Li, “Safety-efficiency integrated assembly: The next-stage
    adaptive task allocation and planning framework for human–robot collaboration,”
    Robotics and Computer-Integrated Manufacturing, vol. 94, Art. no. 102942, 2025,
    doi: 10.1016/j.rcim.2024.102942.'
  nature: 'Zhao, R., Tao, S. & Li, P. Safety-efficiency integrated assembly: The next-stage
    adaptive task allocation and planning framework for human–robot collaboration.
    Robot. Comput.-Integr. Manuf. 94, 102942 (2025).'
  bibtex: |-
    @article{zhao2025safety,
      title = {Safety-efficiency integrated assembly: The next-stage adaptive task allocation and planning framework for human–robot collaboration},
      author = {Zhao, Ruihan and Tao, Sichen and Li, Pengzhong},
      year = {2025},
      journal = {Robotics and Computer-Integrated Manufacturing},
      volume = {94},
      pages = {102942},
      publisher = {Elsevier BV},
      doi = {10.1016/j.rcim.2024.102942},
      url = {https://www.sciencedirect.com/science/article/pii/S0736584524002291},
      status = {published},
      selected = {true},
      public = {true},
      authorrole = {coauthor},
      abbr = {RCIM},
      corresponding = {Li, Pengzhong},
      abstract = {Human–robot collaboration (HRC) has sparked a new wave of the resilient, sustainable, and human-centric industrial revolution. In HRC-enabled manufacturing, safety is a constant focus since the traditional physical barriers between robots and humans are removed. Meanwhile, ensuring efficiency has also gained considerable attention with the rise in production demands and market competition. However, the integration and balance between these two critical prerequisites are overlooked in the task allocation and planning phase of the HRC assembly. In this paper, an adaptive task allocation and planning framework is proposed by simultaneously considering the safety and efficiency of HRC assembly. First, an execution time optimization strategy (ETO) is presented. This strategy adaptively adjusts safety paradigms in the spatio-temporal shared workspace. Thereby, the execution time of assembly tasks is well optimized while ensuring human–robot safety. Second, based on ETO and collaborative assembly task requirements, the safety-efficiency integrated assembly planning problem (SEAPP) is proposed and modeled. Third, compared to conventional single-objective HRC assembly planning problems, the solution space of SEAPP is significantly expanded, leading to a substantial increase in optimization complexity. Thus, a novel constrained multi-objective co-evolutionary algorithm, called GDCA, is proposed. By combining the complementary advantages of different evolutionary operators, GDCA enhances the diversity of solutions while ensuring convergence of optimization process. In comparison with variants that rely solely on a single evolutionary strategy, GDCA maintains better and more stable performance, validating the effectiveness of the co-evolutionary process. GDCA is also compared with four state-of-the-art constrained multi-objective optimization algorithms across a variety of SEAPP instances, widely spanning different task scales and durations. Across 20 assembly instances, GDCA shows superior IGD over NSGA-II, PPS, BiCo, and MCCMO in 17, 19, 18, and 17 instances, and better HV in 17, 19, 17, and 17 instances, respectively. Furthermore, the feasibility and effectiveness of the proposed SEAPF are validated by an industrial challenge in the HRC computer assembly. While ensuring safety, it significantly reduces the total assembly completion time, achieving a 6.2% time reduction over the SSM paradigm and 47.8% over the PFL paradigm, respectively.},
      preview = {safety-efficiency-assembly-fig1.jpg}
    }
